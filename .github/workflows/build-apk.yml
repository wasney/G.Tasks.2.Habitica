name: Build HabitSync Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Project Root
        id: find_root
        run: |
          FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -n "$FOUND" ]; then
            echo "dir=$(dirname "$FOUND")" >> $GITHUB_OUTPUT
          else
            echo "Error: Could not find settings.gradle.kts in repository! Make sure you uploaded the Android project files."
            exit 1
          fi

      - name: Print Debug Keystore SHA-1 Fingerprint (For Google Cloud Console OAuth)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== COPY THIS SHA-1 INTO GOOGLE CLOUD CONSOLE (ANDROID OAUTH CLIENT) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1

      - name: Build Debug APK
        working-directory: ${{ steps.find_root.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitSync-debug-apk
          path: ${{ steps.find_root.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
